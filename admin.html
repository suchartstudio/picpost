<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><title>Admin - Room Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>สร้างห้องกิจกรรม (Event Room Manager)</h2>
  <button onclick="createRoom()">สร้างห้องใหม่</button>
  <div id="roomInfo" style="margin-top: 20px;"></div>

  <script>
    function createRoom() {
      const roomId = 'room_' + Math.random().toString(36).substr(2, 9);
      const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', '');
      
      const uploadUrl = `${baseUrl}upload.html?room=${roomId}`;
      const displayUrl = `${baseUrl}display.html?room=${roomId}`;
      const controlUrl = `${baseUrl}control.html?room=${roomId}`;
      const recheckUrl = `${baseUrl}recheck.html?room=${roomId}`;

      document.getElementById('roomInfo').innerHTML = `
        <h3>Room ID: ${roomId}</h3>
        <p><b>ลิงค์อัพโหลดภาพ (QR Code):</b> <a href="${uploadUrl}" target="_blank">${uploadUrl}</a></p>
        <div id="qrcode"></div>
        <p><b>ลิงค์ OBS Display:</b> <a href="${displayUrl}" target="_blank">${displayUrl}</a></p>
        <p><b>ลิงค์ Control Panel:</b> <a href="${controlUrl}" target="_blank">${controlUrl}</a></p>
        <p><b>ลิงค์ Recheck (Moderation):</b> <a href="${recheckUrl}" target="_blank">${recheckUrl}</a></p>
      `;
      document.getElementById('qrcode').innerHTML = "";
      new QRCode(document.getElementById("qrcode"), uploadUrl);
    }
  </script>
</body>
</html>
