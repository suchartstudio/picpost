<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้างลิงก์ Event (OBS System)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background: #0f1117; color: #e2e8f0; padding: 20px; display: flex; justify-content: center; margin: 0; }
    .container { width: 100%; max-width: 500px; background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .section-title { font-size: 16px; font-weight: 600; color: #00f0ff; margin: 0; }
    .btn-manage { background: #30363d; color: #00f0ff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .btn-manage:hover { background: #484f58; }

    .input-group { margin-bottom: 20px; margin-top: 15px; }
    label { display: block; font-size: 14px; color: #c9d1d9; margin-bottom: 8px; }
    
    #room-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #00f0ff; background: #0d1117; color: #fff; font-size: 16px; font-weight: bold; text-align: center; }
    
    .link-box { display: flex; gap: 10px; margin-bottom: 12px; }
    .link-box input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #8b949e; font-size: 13px; }
    .btn-copy { padding: 8px 15px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    
    .btn-obs { background: #7928ca; color: white; }
    .btn-obs:hover { background: #5e1f9d; }
    .btn-donate { background: #00f0ff; color: #0d1117; }
    .btn-donate:hover { background: #00c4d1; }
    .btn-recheck { background: #f85149; color: white; }
    .btn-recheck:hover { background: #d73a33; }
    .btn-control { background: #238636; color: white; }
    .btn-control:hover { background: #2ea043; }
    
    .copied { background: #2ea043 !important; color: white !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="section-title">🔧 สร้างห้องและลิงก์สำหรับ Event</div>
      <a href="manage.html" class="btn-manage">🗂️ ดูห้องทั้งหมด</a>
    </div>
    
    <div class="input-group">
      <label>1. ตั้งชื่อห้อง (ภาษาอังกฤษ หรือ ตัวเลข):</label>
      <input type="text" id="room-input" placeholder="เช่น event01, wedding" value="default">
    </div>

    <div class="section-title" style="margin-bottom: 15px;">🔗 ลิงก์สำหรับนำไปใช้งาน</div>
    
    <label>📺 ลิงก์สำหรับใส่ Browser Source ใน OBS (Overlay)</label>
    <div class="link-box">
      <input type="text" id="link-overlay" readonly>
      <button class="btn-copy btn-obs" onclick="copyLink('link-overlay', this)">📋 Copy</button>
    </div>

    <label>📱 ลิงก์สำหรับส่งให้ผู้ชมสแกนส่งรูป (Donate)</label>
    <div class="link-box">
      <input type="text" id="link-donate" readonly>
      <button class="btn-copy btn-donate" onclick="copyLink('link-donate', this)">📋 Copy</button>
    </div>

    <label>🛡️ ลิงก์สำหรับแอดมินลบรูป (Recheck)</label>
    <div class="link-box">
      <input type="text" id="link-recheck" readonly>
      <button class="btn-copy btn-recheck" onclick="copyLink('link-recheck', this)">📋 Copy</button>
    </div>

    <label>⚙️ ลิงก์สำหรับเปิดแผงควบคุม (Control)</label>
    <div class="link-box">
      <input type="text" id="link-control" readonly>
      <button class="btn-copy btn-control" onclick="copyLink('link-control', this)">📋 Copy</button>
    </div>
  </div>

  <script>
    const GITHUB_PAGES_BASE_URL = "https://suchartstudio.github.io/picpost/";

    const roomInput = document.getElementById('room-input');
    const overlayInput = document.getElementById('link-overlay');
    const donateInput = document.getElementById('link-donate');
    const recheckInput = document.getElementById('link-recheck');
    const controlInput = document.getElementById('link-control');

    function generateLinks() {
      const roomName = roomInput.value.trim() || 'default';
      overlayInput.value = `${GITHUB_PAGES_BASE_URL}overlay.html?room=${roomName}`;
      donateInput.value = `${GITHUB_PAGES_BASE_URL}donate.html?room=${roomName}`;
      recheckInput.value = `${GITHUB_PAGES_BASE_URL}recheck.html?room=${roomName}`;
      controlInput.value = `${GITHUB_PAGES_BASE_URL}control.html?room=${roomName}`;
    }

    function copyLink(inputId, btnElement) {
      const copyText = document.getElementById(inputId);
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      
      navigator.clipboard.writeText(copyText.value).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "✅ Copied!";
        btnElement.classList.add("copied");
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove("copied");
        }, 2000);
      }).catch(() => alert("ไม่สามารถคัดลอกได้"));
    }

    roomInput.addEventListener('input', generateLinks);
    window.onload = generateLinks;
  </script>

</body>
</html>
