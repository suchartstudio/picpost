<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel (แผงควบคุม)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    
    body { background: #0f1117; color: #e2e8f0; padding: 20px; display: flex; justify-content: center; margin: 0; }
    .container { width: 100%; max-width: 500px; }
    
    .card { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 20px; }
    .section-title { font-size: 16px; font-weight: 600; color: #00f0ff; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; color: #c9d1d9; margin-bottom: 8px; font-weight: 500; }
    
    input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 14px; transition: 0.2s; }
    input[type="text"]:focus { border-color: #00f0ff; outline: none; }
    
    .switch-container { display: flex; align-items: center; justify-content: space-between; background: #0d1117; padding: 10px 15px; border-radius: 6px; border: 1px solid #30363d; }
    .switch-container span { font-size: 14px; color: #fff; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: #00f0ff; cursor: pointer; }
    
    .slider-container { display: flex; align-items: center; gap: 15px; }
    input[type="range"] { flex: 1; accent-color: #00f0ff; cursor: pointer; }
    .val-display { background: #0d1117; border: 1px solid #30363d; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; color: #00f0ff; min-width: 70px; text-align: center; }

    .btn-danger { width: 100%; padding: 12px; border: none; border-radius: 6px; background: transparent; border: 1px solid rgba(248, 81, 73, 0.5); color: #f85149; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-danger:hover { background: rgba(248, 81, 73, 0.1); border-color: #f85149; }

    .status-text { text-align: center; font-size: 13px; color: #2ea043; font-weight: 600; margin-top: 10px; height: 20px; opacity: 0; transition: opacity 0.3s; }
    .status-text.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ฟังก์ชันจัดการห้องที่นำกลับมา (เอาหัวข้อออก) -->
    <div class="card">
      <button class="btn-danger" id="btn-clear-photos">🗑️ ล้างรูปภาพทั้งหมดในห้องนี้</button>
    </div>

    <!-- ฟังก์ชันควบคุม Realtime -->
    <div class="card">
      <div class="section-title">⚙️ ตั้งค่าหน้าจอ Overlay (Realtime)</div>
      
      <div class="input-group switch-container">
        <span>📱 แสดง QR Code บนจอ (มุมขวาล่าง)</span>
        <input type="checkbox" id="toggle-qr">
      </div>

      <div class="input-group">
        <label>✍️ ข้อความกำกับใต้ QR Code</label>
        <input type="text" id="welcome-text" placeholder="เช่น สแกนส่งรูปขึ้นจอ">
      </div>

      <div class="input-group">
        <label>🫧 ความเร็วการปล่อยฟองสบู่ (น้อย = ถี่มาก)</label>
        <div class="slider-container">
          <input type="range" id="spawn-speed" min="1000" max="6000" step="500" value="2500">
          <div class="val-display" id="speed-display">2500 ms</div>
        </div>
      </div>

      <div class="status-text" id="save-status">✅ ส่งค่าอัปเดตไปที่จอ Overlay แล้ว</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8",
      measurementId: "G-J7M38HNDYD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    const settingsRef = ref(db, `events/${roomId}/settings`);

    const toggleQr = document.getElementById('toggle-qr');
    const welcomeText = document.getElementById('welcome-text');
    const spawnSpeed = document.getElementById('spawn-speed');
    const speedDisplay = document.getElementById('speed-display');
    const saveStatus = document.getElementById('save-status');
    const btnClearPhotos = document.getElementById('btn-clear-photos');

    let isInitialLoad = true;

    function showSavedStatus() {
      saveStatus.classList.add('show');
      setTimeout(() => saveStatus.classList.remove('show'), 1500);
    }

    // ฟังก์ชันส่งค่าทุกอย่างเข้า Firebase (Realtime)
    function saveSettings() {
      if (isInitialLoad) return; // ป้องกันการส่งค่าทับตอนโหลดหน้าครั้งแรก
      
      update(settingsRef, {
        showQR: toggleQr.checked,
        welcomeText: welcomeText.value,
        spawnSpeed: Number(spawnSpeed.value)
      }).then(() => {
        showSavedStatus();
      });
    }

    // ดึงค่าปัจจุบันมาแสดงตอนเปิดหน้า (ทำแค่ครั้งเดียว)
    onValue(settingsRef, (snapshot) => {
      if (snapshot.exists() && isInitialLoad) {
        const data = snapshot.val();
        if (data.showQR !== undefined) toggleQr.checked = data.showQR;
        if (data.welcomeText) welcomeText.value = data.welcomeText;
        if (data.spawnSpeed) {
          spawnSpeed.value = data.spawnSpeed;
          speedDisplay.innerText = `${data.spawnSpeed} ms`;
        }
        isInitialLoad = false;
      }
    }, { onlyOnce: true });

    // ดักจับเหตุการณ์การเปลี่ยนแปลงทั้งหมดเพื่ออัปเดต Realtime
    toggleQr.addEventListener('change', saveSettings);
    
    spawnSpeed.addEventListener('input', (e) => {
      speedDisplay.innerText = `${e.target.value} ms`;
      saveSettings(); // อัปเดตทันทีที่ลากสไลเดอร์
    });

    welcomeText.addEventListener('input', () => {
      saveSettings(); // อัปเดตทันทีที่พิมพ์ข้อความแต่ละตัวอักษร
    });

    // ฟังก์ชันล้างรูปภาพ (ที่ถูกนำกลับมา)
    btnClearPhotos.addEventListener('click', () => {
      if(confirm('⚠️ ยืนยันการลบรูปภาพทั้งหมดของห้องนี้ออกจากระบบ?')) {
        remove(ref(db, `events/${roomId}/donations`))
          .then(() => alert('✅ ลบรูปภาพทั้งหมดเรียบร้อยแล้ว'))
          .catch(err => alert('❌ เกิดข้อผิดพลาด: ' + err.message));
      }
    });
  </script>

</body>
</html>
