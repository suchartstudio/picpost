<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Control Panel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background: #0f1117; color: #e2e8f0; padding: 20px; display: flex; justify-content: center; margin: 0; }
    .container { width: 100%; max-width: 600px; display: none; }
    
    #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 17, 23, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    #lock-screen input { padding: 15px; font-size: 20px; text-align: center; border-radius: 8px; border: 2px solid #30363d; background: #0d1117; color: #fff; margin-bottom: 15px; width: 250px;}
    #lock-screen button { padding: 12px 30px; font-size: 16px; background: #00f0ff; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    
    .card { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; margin-bottom: 8px; font-weight: 500; color: #c9d1d9;}
    select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 15px; }
    .btn-link { display: block; text-align: center; padding: 12px; background: #238636; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;}
  </style>
</head>
<body>

  <div id="lock-screen">
      <h2 style="color: #00f0ff; margin-bottom: 20px;">🔒 รหัสผ่าน Control</h2>
      <input type="password" id="pin-input" placeholder="รหัสผ่าน">
      <button onclick="checkPin()">เข้าสู่ระบบ</button>
  </div>

  <div class="container" id="main-content">
    <div class="card"><a href="recheck.html" target="_blank" class="btn-link">📁 เปิดหน้าจัดการรูปภาพ (ลบรูปทีละหลายไฟล์)</a></div>
    <div class="card">
      <h3 style="color: #00f0ff; margin-top: 0;">⚙️ ตั้งค่า Layout</h3>
      
      <div class="input-group">
        <label>📺 โหมดการแสดงผลวงกลมภาพบนจอ</label>
        <select id="display-mode">
          <option value="full">1. กระจายแสดงแบบเต็มจอ (Full Screen)</option>
          <option value="split">2. ชิดขอบซ้าย-ขวา (เว้นพื้นที่ตรงกลาง)</option>
        </select>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    window.checkPin = function() {
        if(document.getElementById('pin-input').value === '987654321') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        } else {
            alert('รหัสผ่านไม่ถูกต้อง');
        }
    };

    const firebaseConfig = { apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk", databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "suchartstudio-9a78d" };
    const db = getDatabase(initializeApp(firebaseConfig));
    const roomId = new URLSearchParams(window.location.search).get('room') || 'default';
    const settingsRef = ref(db, `events/${roomId}/settings`);

    const displayModeSelect = document.getElementById('display-mode');
    let isInit = true;

    displayModeSelect.addEventListener('change', () => {
        if(!isInit) update(settingsRef, { displayMode: displayModeSelect.value });
    });

    onValue(settingsRef, (snapshot) => {
      if (snapshot.exists() && snapshot.val().displayMode) {
          displayModeSelect.value = snapshot.val().displayMode;
      }
      isInit = false;
    });
  </script>
</body>
</html>
