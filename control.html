```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Profiles</title>
    <style>
        :root {
            /* 4. ปรับขนาด QR Code ตรงนี้ */
            --qr-size: 150px; 
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Kanit', sans-serif;
        }

        /* ตั้งค่า QR Code */
        .qr-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: var(--qr-size);
            height: var(--qr-size);
            background: white;
            padding: 10px;
            border-radius: 10px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-container img {
            width: 100%;
            height: 100%;
        }

        /* 3. สไตล์สำหรับคนที่เพิ่งเข้ามา (เด้งกลางจอ) */
        .highlight-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 1000;
        }
        
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } /* ขยายให้ใหญ่ขึ้นกลางจอ */
        }

        /* สไตล์หลักของวงกลมที่ลอยขึ้น */
        .bubble-wrapper {
            position: absolute;
            bottom: -200px;
            animation: floatUp 8s linear forwards;
            z-index: 1;
        }

        /* 5. เอฟเฟกต์โยกซ้ายขวาเบาๆ */
        .bubble-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes floatUp {
            0% { bottom: -200px; opacity: 1; }
            100% { bottom: 110vh; opacity: 0.8; }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(-15px); }
            50% { transform: translateX(15px); }
        }

        .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white; /* สีเส้นขอบจะถูกสุ่มทับด้วย JS */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 1. ปรับขนาดชื่อให้ใหญ่ขึ้น */
        .name {
            color: white;
            font-size: 24px; 
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="qr-container">
        <!-- ใส่รูป QR Code ของคุณที่นี่ -->
        <img src="[https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Register](https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Register)" alt="QR Code">
    </div>

    <script>
        // 2. ฟังก์ชันสุ่มสีเส้นขอบไม่ให้ซ้ำกัน
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 80%, 65%)`; // ใช้ HSL เพื่อให้ได้สีที่สดใสเสมอ
        }

        function addPerson(name, profileImgSrc) {
            // สร้าง Wrapper
            const wrapper = document.createElement('div');
            wrapper.className = 'highlight-center'; // เริ่มต้นด้วยการเด้งกลางจอ (ข้อ 3)

            // สร้าง Inner สำหรับทำส่าย (ข้อ 5)
            const inner = document.createElement('div');
            inner.className = 'bubble-inner';

            // สร้างรูปโปรไฟล์
            const circle = document.createElement('img');
            circle.className = 'circle';
            circle.src = profileImgSrc;
            circle.style.borderColor = getRandomColor(); // ใช้สีสุ่ม (ข้อ 2)

            // สร้างชื่อ (ข้อ 1 - ขนาดปรับใน CSS .name)
            const nameLabel = document.createElement('div');
            nameLabel.className = 'name';
            nameLabel.innerText = name;

            // ประกอบร่าง HTML
            inner.appendChild(circle);
            inner.appendChild(nameLabel);
            wrapper.appendChild(inner);
            document.body.appendChild(wrapper);

            // 3. หน่วงเวลา 3 วินาที จากนั้นเปลี่ยนจากกลางจอเป็นลอยขึ้น
            setTimeout(() => {
                wrapper.className = 'bubble-wrapper';
                // สุ่มตำแหน่งซ้ายขวา (10% - 90% ของหน้าจอ) ตอนเริ่มลอย
                wrapper.style.left = Math.floor(Math.random() * 80 + 10) + 'vw';
                
                // ทำความสะอาด DOM หลังจากลอยพ้นจอไปแล้ว (ประมาณ 8 วินาทีตาม CSS)
                setTimeout(() => {
                    wrapper.remove();
                }, 8000);
            }, 3000);
        }

        // --- สำหรับทดสอบระบบ ---
        // จำลองการมีคนสแกนเข้ามาใหม่ทุกๆ 4 วินาที
        let count = 1;
        setInterval(() => {
            // ดึงรูปโปรไฟล์แบบสุ่มมาทดสอบ
            addPerson(`ผู้ใช้งาน ${count}`, `[https://i.pravatar.cc/150?img=$](https://i.pravatar.cc/150?img=$){count}`);
            count++;
        }, 4000);
    </script>
</body>
</html>
