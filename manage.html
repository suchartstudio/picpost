<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการห้อง Event</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background: #0f1117; color: #e2e8f0; padding: 20px; margin: 0; }
    
    #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 17, 23, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    #lock-screen input { padding: 15px; font-size: 20px; text-align: center; border-radius: 8px; border: 2px solid #30363d; background: #0d1117; color: #fff; margin-bottom: 15px; letter-spacing: 5px; width: 250px;}
    #lock-screen button { padding: 12px 30px; font-size: 16px; background: #7928ca; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #main-content { display: none; }

    .header { max-width: 1000px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
    .header h2 { color: #00f0ff; margin: 0; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .room-header { display: flex; justify-content: space-between; border-bottom: 1px solid #21262d; padding-bottom: 10px; margin-bottom: 12px; font-size: 18px; font-weight: 600; }
    .link-item { display: flex; justify-content: space-between; background: #0d1117; padding: 8px; margin-bottom: 8px; border-radius: 6px; font-size: 13px; }
    .btn-open { background: rgba(0, 240, 255, 0.15); color: #00f0ff; text-decoration: none; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="lock-screen">
      <h2 style="color: #00f0ff; margin-bottom: 20px;">🔒 รหัสผ่านหน้า Manage</h2>
      <input type="password" id="pin-input" placeholder="รหัส PIN" maxlength="6">
      <button onclick="checkPin()">เข้าสู่ระบบ</button>
  </div>

  <div id="main-content">
    <div class="header">
      <h2>🗂️ จัดการห้องทั้งหมด</h2>
    </div>
    <div class="grid" id="room-container"><div style="text-align:center;width:100%;">กำลังโหลดข้อมูล...</div></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    window.checkPin = function() {
        if(document.getElementById('pin-input').value === '878556') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        } else {
            alert('รหัสผ่านไม่ถูกต้อง');
            document.getElementById('pin-input').value = '';
        }
    };

    const firebaseConfig = { apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk", databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "suchartstudio-9a78d" };
    const db = getDatabase(initializeApp(firebaseConfig));
    const BASE_URL = "https://suchartstudio.github.io/picpost/";

    onValue(ref(db, 'events'), (snapshot) => {
      const container = document.getElementById('room-container');
      container.innerHTML = '';
      if (!snapshot.exists()) return container.innerHTML = '<div style="text-align:center;width:100%;">ไม่มีห้องในระบบ</div>';
      
      snapshot.forEach((childSnap) => {
        const roomId = childSnap.key;
        container.innerHTML += `
          <div class="card">
            <div class="room-header">📌 ${roomId}</div>
            <div class="link-item"><span>⚙️ Control</span><a href="${BASE_URL}control.html?room=${roomId}" target="_blank" class="btn-open">🔗 เปิด</a></div>
            <div class="link-item"><span>📺 Overlay</span><a href="${BASE_URL}overlay.html?room=${roomId}" target="_blank" class="btn-open">🔗 เปิด</a></div>
            <div class="link-item"><span>📱 Donate</span><a href="${BASE_URL}donate.html?room=${roomId}" target="_blank" class="btn-open">🔗 เปิด</a></div>
          </div>`;
      });
    });
  </script>
</body>
</html>
