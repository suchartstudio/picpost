<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการห้อง Event (Dashboard)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background: #0f1117; color: #e2e8f0; padding: 20px; margin: 0; }
    
    .header { max-width: 1000px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
    .header h2 { color: #00f0ff; margin: 0; }
    .btn-new { background: #7928ca; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
    .btn-new:hover { background: #5e1f9d; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; transition: 0.2s; display: flex; flex-direction: column; }
    .card:hover { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
    
    .room-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; padding-bottom: 10px; margin-bottom: 12px; }
    .room-name { font-size: 18px; color: #fff; font-weight: 600; }
    .badge-count { background: rgba(0, 240, 255, 0.1); color: #00f0ff; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(0, 240, 255, 0.3); }
    
    .link-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .link-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 8px 12px; border-radius: 6px; border: 1px solid #21262d; font-size: 13px; }
    .link-title { color: #c9d1d9; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .action-btns { display: flex; gap: 6px; }
    
    .btn-icon { background: #21262d; color: #8b949e; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; font-weight: 600; transition: 0.2s; }
    .btn-icon:hover { background: #30363d; color: #fff; }
    .btn-open { background: rgba(0, 240, 255, 0.15); color: #00f0ff; }
    .btn-open:hover { background: #00f0ff; color: #0d1117; }
    
    .btn-delete { background: transparent; color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; font-size: 13px; transition: 0.2s; margin-top: auto; }
    .btn-delete:hover { background: rgba(248, 81, 73, 0.1); border-color: #f85149; }
    
    .empty-state { text-align: center; color: #8b949e; grid-column: 1 / -1; padding: 40px; background: #161b22; border-radius: 10px; border: 1px dashed #30363d; }
  </style>
</head>
<body>

  <!-- Login Overlay (รหัส 878556) -->
  <div id="login-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0f1117;z-index:9999;display:flex;justify-content:center;align-items:center;flex-direction:column;">
    <h2 style="color:#00f0ff;margin-bottom:20px;">🔒 ยืนยันตัวตน (หน้า Manage)</h2>
    <input type="password" id="pass-input" placeholder="ใส่รหัสผ่าน" style="padding:10px;border-radius:6px;border:1px solid #21262d;background:#161b22;color:#fff;margin-bottom:15px;text-align:center;font-size:18px;outline:none;">
    <button id="login-btn" style="padding:10px 30px;background:#7928ca;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;font-weight:600;">เข้าสู่ระบบ</button>
    <p id="error-msg" style="color:#f85149;margin-top:15px;display:none;">❌ รหัสผ่านไม่ถูกต้อง</p>
  </div>
  <script>
    document.getElementById('login-btn').addEventListener('click', () => {
      if(document.getElementById('pass-input').value === '878556') {
        document.getElementById('login-overlay').style.display = 'none';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    });
  </script>

  <div class="header">
    <h2>🗂️ ระบบจัดการห้อง (Dashboard)</h2>
    <a href="index.html" class="btn-new">➕ สร้างลิงก์ห้องใหม่</a>
  </div>

  <div class="grid" id="room-container">
    <div class="empty-state">⏳ กำลังโหลดข้อมูล...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8",
      measurementId: "G-J7M38HNDYD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const container = document.getElementById('room-container');
    const BASE_URL = "https://suchartstudio.github.io/picpost/";

    onValue(ref(db, 'events'), (snapshot) => {
      container.innerHTML = '';
      
      if (!snapshot.exists()) {
        container.innerHTML = '<div class="empty-state">ยังไม่มีห้องที่ถูกสร้างในระบบ<br>เริ่มส่งรูปหรือกดสร้างห้องใหม่ได้เลย</div>';
        return;
      }
      
      snapshot.forEach((childSnap) => {
        const roomId = childSnap.key;
        const data = childSnap.val();
        const picCount = data.donations ? Object.keys(data.donations).length : 0;
        
        const controlUrl = `${BASE_URL}control.html?room=${roomId}`;
        const overlayUrl = `${BASE_URL}overlay.html?room=${roomId}`;
        const donateUrl = `${BASE_URL}donate.html?room=${roomId}`;
        const recheckUrl = `${BASE_URL}recheck.html?room=${roomId}`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="room-header">
            <div class="room-name">📌 ${roomId}</div>
            <div class="badge-count">📷 ${picCount} รูป</div>
          </div>
          <div class="link-group">
            <div class="link-item">
              <span class="link-title">⚙️ Control Panel</span>
              <div class="action-btns">
                <button class="btn-icon" onclick="copyText('${controlUrl}', this)">📋 Copy</button>
                <a href="${controlUrl}" target="_blank" class="btn-icon btn-open">🔗 เปิด</a>
              </div>
            </div>
            <div class="link-item">
              <span class="link-title">📺 OBS Overlay</span>
              <div class="action-btns">
                <button class="btn-icon" onclick="copyText('${overlayUrl}', this)">📋 Copy</button>
                <a href="${overlayUrl}" target="_blank" class="btn-icon btn-open">🔗 เปิด</a>
              </div>
            </div>
            <div class="link-item">
              <span class="link-title">📱 Donate (สแกนรูป)</span>
              <div class="action-btns">
                <button class="btn-icon" onclick="copyText('${donateUrl}', this)">📋 Copy</button>
                <a href="${donateUrl}" target="_blank" class="btn-icon btn-open">🔗 เปิด</a>
              </div>
            </div>
            <div class="link-item">
              <span class="link-title">🛡️ Recheck (ลบรูป)</span>
              <div class="action-btns">
                <button class="btn-icon" onclick="copyText('${recheckUrl}', this)">📋 Copy</button>
                <a href="${recheckUrl}" target="_blank" class="btn-icon btn-open">🔗 เปิด</a>
              </div>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteRoom('${roomId}')">🗑️ ลบห้องนี้และล้างรูปทั้งหมด</button>
        `;
        container.appendChild(card);
      });
    });

    window.copyText = (text, btnElement) => {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btnElement.innerText;
        btnElement.innerText = "✅";
        setTimeout(() => btnElement.innerText = orig, 1500);
      });
    };

    window.deleteRoom = (roomId) => {
      if(confirm(`⚠️ อันตราย: คุณต้องการลบห้อง "${roomId}"\nและรูปภาพทั้งหมดที่ผู้ชมส่งมาทิ้งถาวรหรือไม่?`)) {
        remove(ref(db, `events/${roomId}`));
      }
    };
  </script>
</body>
</html>
