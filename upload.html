<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Photo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    input, button { display: block; width: 100%; margin: 15px 0; padding: 12px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>ส่งภาพขึ้นหน้าจอ</h2>
  <input type="text" id="username" placeholder="ใส่ชื่อของคุณ" required>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <button onclick="uploadImage()">ส่งภาพ</button>
  <p id="status"></p>

  <script type="module">
    import { db, ref, push, set } from './firebase-config.js';

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    window.uploadImage = function() {
      const name = document.getElementById('username').value.trim();
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');

      if (!roomId) return alert('ไม่พบรหัสห้องกิจกรรม');
      if (!name || !fileInput.files[0]) return alert('กรุณากรอกชื่อและเลือกรูปภาพ');

      status.innerText = "กำลังประมวลผลรูปภาพ...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          // ย่อขนาดภาพก่อนแปลงเป็น Base64 เพื่อประหยัดพื้นที่ RTDB
          const canvas = document.createElement('canvas');
          const maxDim = 400;
          let width = img.width; let height = img.height;
          if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } }
          else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
          
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          const base64Image = canvas.toDataURL('image/jpeg', 0.7);
          
          const photosRef = ref(db, `rooms/${roomId}/photos`);
          const newPhotoRef = push(photosRef);
          set(newPhotoRef, {
            name: name,
            image: base64Image,
            timestamp: Date.now(),
            status: "active"
          }).then(() => {
            status.innerText = "ส่งภาพสำเร็จแล้ว!";
            fileInput.value = "";
          }).catch(err => status.innerText = "เกิดข้อผิดพลาด: " + err.message);
        };
      };
      reader.readAsDataURL(fileInput.files[0]);
    }
  </script>
</body>
</html>
