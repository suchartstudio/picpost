<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>จัดการรูปภาพ (Recheck)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap');
    body { font-family: 'Kanit', sans-serif; background: #161b22; color: white; padding: 20px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 10px;}
    .btn-danger { background: #f85149; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;}
    .btn-secondary { background: #30363d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;}
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .card { background: #0d1117; padding: 10px; border-radius: 8px; border: 1px solid #30363d; position: relative; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
    .card .info { margin-top: 10px; font-size: 14px; text-align: center; }
    
    .checkbox-container { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 5px; border-radius: 4px; }
    .checkbox-container input { width: 20px; height: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h2>📸 ตรวจสอบและลบรูปภาพ</h2>
    <div>
      <button class="btn-secondary" onclick="toggleSelectAll()">เลือกทั้งหมด</button>
      <button class="btn-danger" id="delete-btn">🗑️ ลบไฟล์ที่เลือก (<span id="sel-count">0</span>)</button>
    </div>
  </div>

  <div class="grid" id="image-grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk", authDomain: "suchartstudio-9a78d.firebaseapp.com", databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "suchartstudio-9a78d" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    const donationsRef = ref(db, `events/${roomId}/donations`);

    const grid = document.getElementById('image-grid');
    let photosData = [];
    let isAllSelected = false;

    // โหลดข้อมูลแบบ Realtime
    onValue(donationsRef, (snapshot) => {
        grid.innerHTML = '';
        photosData = [];
        if(snapshot.exists()) {
            snapshot.forEach(child => {
                const data = child.val();
                const key = child.key;
                const imgUrl = data.imageUrl || data.url;
                const name = data.name || data.senderName || data.displayName || 'ไม่มีชื่อ';
                
                photosData.push({key, imgUrl, name});
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="checkbox-container"><input type="checkbox" class="img-checkbox" value="${key}" onchange="updateCount()"></div>
                    <img src="${imgUrl}" alt="Photo">
                    <div class="info">${name}</div>
                `;
                grid.appendChild(card);
            });
        } else {
            grid.innerHTML = '<p>ไม่มีรูปภาพในระบบ</p>';
        }
        updateCount();
    });

    window.toggleSelectAll = function() {
        isAllSelected = !isAllSelected;
        document.querySelectorAll('.img-checkbox').forEach(cb => cb.checked = isAllSelected);
        updateCount();
    };

    window.updateCount = function() {
        const count = document.querySelectorAll('.img-checkbox:checked').length;
        document.getElementById('sel-count').innerText = count;
    };

    document.getElementById('delete-btn').addEventListener('click', async () => {
        const selected = Array.from(document.querySelectorAll('.img-checkbox:checked')).map(cb => cb.value);
        if(selected.length === 0) return alert('กรุณาเลือกรูปที่ต้องการลบ');
        
        if(confirm(`ยืนยันการลบ ${selected.length} รูป? (ไฟล์จะหายไปจากหน้าจอ Overlay ทันที)`)) {
            for(let key of selected) {
                await remove(ref(db, `events/${roomId}/donations/${key}`));
            }
        }
    });
  </script>
</body>
</html>
