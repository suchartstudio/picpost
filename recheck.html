<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recheck System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    
    :root {
      --card-size: 150px;
    }

    body { 
      background: #0f1117; 
      color: #e2e8f0; 
      margin: 0; 
      padding: 15px; 
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      padding: 10px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-container label {
      font-size: 14px;
      color: #00f0ff;
      font-weight: 600;
      white-space: nowrap;
    }

    input[type=range] {
      width: 150px;
      accent-color: #00f0ff;
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn-outline {
      padding: 6px 12px; background: transparent; color: #00f0ff; border: 1px solid #00f0ff;
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px;
    }
    .btn-outline:hover { background: rgba(0, 240, 255, 0.1); }

    .btn-danger-top {
      padding: 6px 12px; background: #f85149; color: white; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px;
    }
    .btn-danger-top:hover { background: #d73a33; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-size), 1fr));
      gap: 12px;
    }

    .img-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
      position: relative;
    }

    .img-card:hover { border-color: #f85149; }

    .checkbox-wrap {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      z-index: 10;
    }

    .delete-cb {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
      accent-color: #f85149;
    }

    .img-card img {
      width: 100%;
      height: var(--card-size);
      object-fit: cover;
      display: block;
    }

    .btn-delete {
      width: 100%;
      padding: 6px;
      background: #f85149;
      color: white;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-delete:hover { background: #d73a33; }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #8b949e;
      padding: 50px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="slider-container">
      <label>🔍 ปรับขนาดภาพ:</label>
      <input type="range" id="size-slider" min="80" max="350" value="150">
    </div>
    <div class="top-actions">
      <button class="btn-outline" id="btn-select-all">☑️ เลือกทั้งหมด</button>
      <button class="btn-danger-top" id="btn-delete-selected">🗑️ ลบที่เลือก</button>
    </div>
  </div>

  <div class="grid" id="gallery-grid">
    <div class="empty-msg">⏳ กำลังโหลดรูปภาพ...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    // เพิ่ม update เข้ามาเพื่อใช้เคลียร์ข้อมูลหลายชุดพร้อมกัน
    import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8",
      measurementId: "G-J7M38HNDYD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    const galleryGrid = document.getElementById('gallery-grid');
    const sizeSlider = document.getElementById('size-slider');
    let isAllSelected = false;

    sizeSlider.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--card-size', `${e.target.value}px`);
    });

    const donationsRef = ref(db, `events/${roomId}/donations`);
    onValue(donationsRef, (snapshot) => {
      galleryGrid.innerHTML = '';
      
      // รีเซ็ตปุ่มเลือกทั้งหมดเมื่อมีการโหลดข้อมูลใหม่
      isAllSelected = false;
      document.getElementById('btn-select-all').innerText = "☑️ เลือกทั้งหมด";

      if (!snapshot.exists()) {
        galleryGrid.innerHTML = '<div class="empty-msg">ไม่มีรูปภาพในระบบ</div>';
        return;
      }

      snapshot.forEach((childSnap) => {
        const photoId = childSnap.key;
        const data = childSnap.val();
        const imgUrl = data.imageUrl || data.url;

        if (imgUrl) {
          const card = document.createElement('div');
          card.className = 'img-card';
          card.innerHTML = `
            <div class="checkbox-wrap">
              <input type="checkbox" class="delete-cb" value="${photoId}">
            </div>
            <img src="${imgUrl}" alt="Photo">
            <button class="btn-delete" onclick="deletePhoto('${photoId}')">🗑️ ลบรูปนี้</button>
          `;
          galleryGrid.appendChild(card);
        }
      });
    });

    window.deletePhoto = (photoId) => {
      if (confirm('คุณต้องการลบรูปนี้ใช่หรือไม่?')) {
        remove(ref(db, `events/${roomId}/donations/${photoId}`));
      }
    };

    // ฟังก์ชันเลือก/ยกเลิกเลือกทั้งหมด
    document.getElementById('btn-select-all').addEventListener('click', (e) => {
      isAllSelected = !isAllSelected;
      const checkboxes = document.querySelectorAll('.delete-cb');
      checkboxes.forEach(cb => cb.checked = isAllSelected);
      e.target.innerText = isAllSelected ? "☒ ยกเลิกการเลือก" : "☑️ เลือกทั้งหมด";
    });

    // ฟังก์ชันลบที่เลือกทั้งหมด
    document.getElementById('btn-delete-selected').addEventListener('click', () => {
      const checkedBoxes = document.querySelectorAll('.delete-cb:checked');
      if (checkedBoxes.length === 0) return alert('กรุณาเลือกรูปภาพอย่างน้อย 1 รูปที่ต้องการลบ');
      
      if (confirm(`คุณแน่ใจหรือไม่ที่จะลบรูปภาพจำนวน ${checkedBoxes.length} รูป?`)) {
        const updates = {};
        checkedBoxes.forEach(cb => {
          updates[cb.value] = null; // กำหนดค่า null เพื่อลบ record นั้น
        });
        
        // อัปเดตลบหลาย record รวดเดียวเพื่อความรวดเร็วและไม่หน่วง Database
        update(ref(db, `events/${roomId}/donations`), updates).then(() => {
          isAllSelected = false;
          document.getElementById('btn-select-all').innerText = "☑️ เลือกทั้งหมด";
        });
      }
    });
  </script>

</body>
</html>
