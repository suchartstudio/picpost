<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบคัดกรองรูปภาพ (Moderation)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');
    body { font-family: 'Kanit', sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 20px; }
    h2 { color: #00f0ff; text-align: center; margin-bottom: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
    .card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .card img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #30363d; margin-bottom: 10px; }
    .card .name { font-weight: 600; margin-bottom: 10px; word-break: break-all; }
    .btn-delete { background: #f85149; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; }
    .btn-delete:hover { background: #da3633; }
  </style>
</head>
<body>
  <h2>🛡️ ระบบตรวจและลบรูปภาพ (Real-time)</h2>
  <div style="text-align: center; color: #8b949e; margin-bottom: 20px;">
    ห้องปัจจุบัน: <strong id="room-name-display" style="color:#00f0ff;"></strong>
  </div>
  
  <div class="grid" id="image-grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onChildRemoved, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8",
      measurementId: "G-J7M38HNDYD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    
    document.getElementById('room-name-display').innerText = roomId;
    const grid = document.getElementById('image-grid');

    onChildAdded(ref(db, `events/${roomId}/donations`), (snapshot) => {
      const data = snapshot.val();
      const key = snapshot.key;

      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${key}`;

      const img = document.createElement('img');
      img.src = data.imageUrl;

      const name = document.createElement('div');
      name.className = 'name';
      name.innerText = data.name;

      const btn = document.createElement('button');
      btn.className = 'btn-delete';
      btn.innerText = '🗑️ ลบทิ้งทันที';
      btn.onclick = () => {
        if(confirm(`ต้องการลบรูปของ "${data.name}" ออกจากหน้าจอเดี๋ยวนี้หรือไม่?`)) {
          remove(ref(db, `events/${roomId}/donations/${key}`));
        }
      };

      card.appendChild(img);
      card.appendChild(name);
      card.appendChild(btn);
      grid.prepend(card);
    });

    onChildRemoved(ref(db, `events/${roomId}/donations`), (snapshot) => {
      const el = document.getElementById(`card-${snapshot.key}`);
      if (el) el.remove();
    });
  </script>
</body>
</html>
