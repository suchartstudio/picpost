<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร่วมส่งภาพขึ้นจอ Live Stream</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap');
    * { box-sizing: border-box; }
    body { background-color: #0b0c10; color: #ffffff; font-family: 'Kanit', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1f2833; border: 2px solid #66fcf1; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 0 20px rgba(102, 252, 241, 0.3); text-align: center; }
    h2 { color: #66fcf1; margin-bottom: 20px; font-weight: 800; text-shadow: 0 0 10px rgba(102,252,241,0.5); }
    .input-group { margin-bottom: 18px; text-align: left; }
    label { display: block; margin-bottom: 6px; color: #45a29e; font-weight: 600; }
    input[type="text"], input[type="file"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; font-size: 16px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(45deg, #ff007f, #7928ca); color: #fff; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
    button:disabled { background: #555; cursor: not-allowed; }
    #status-msg { margin-top: 15px; font-weight: 600; color: #ffe600; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 ส่งรูปขึ้นจอ Live!</h2>
    <div class="input-group">
      <label>ชื่อของคุณ / ฉายา</label>
      <input type="text" id="donor-name" placeholder="ใส่ชื่อของคุณ">
    </div>
    <div class="input-group">
      <label>เลือกรูปถ่าย / รูปโปรไฟล์</label>
      <input type="file" id="donor-file" accept="image/*">
    </div>
    <button id="submit-btn">🚀 ส่งรูปเข้าจอสตรีม</button>
    <div id="status-msg">⏳ กำลังประมวลผลและย่อขนาดรูปภาพ...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8",
      measurementId: "G-J7M38HNDYD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    const btn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    function compressImageToBase64(file, maxWidth = 300, maxHeight = 300, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image(); img.src = event.target.result;
          img.onload = () => {
            let width = img.width, height = img.height;
            if (width > height) { if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } } 
            else { if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; } }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    btn.addEventListener('click', async () => {
      const name = document.getElementById('donor-name').value || "เพื่อนใหม่";
      const fileInput = document.getElementById('donor-file');
      if (!fileInput.files[0]) return alert('กรุณาเลือกรูปภาพก่อนส่งครับ');

      btn.disabled = true; statusMsg.style.display = 'block';
      try {
        const file = fileInput.files[0];
        const base64Image = await compressImageToBase64(file, 250, 250, 0.7);
        await push(ref(db, `events/${roomId}/donations`), {
          name, imageUrl: base64Image, timestamp: Date.now()
        });
        alert('✨ ส่งรูปสำเร็จ! รอดูรูปเด้งขึ้นหน้าจอ Live ได้เลย');
        location.reload();
      } catch (err) {
        console.error(err); alert('เกิดข้อผิดพลาดในการประมวลผลรูปภาพ');
        btn.disabled = false; statusMsg.style.display = 'none';
      }
    });
  </script>
</body>
</html>
