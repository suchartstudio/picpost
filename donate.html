<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่งรูปขึ้นจอ</title>
  <style>
    /* นำเข้าฟอนต์ Sriracha จาก Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Sriracha&display=swap');
    
    * {
      box-sizing: border-box;
      /* ตั้งค่าให้ใช้ฟอนต์ Sriracha เป็นหลัก */
      font-family: 'Sriracha', cursive;
    }
    
    body {
      margin: 0; 
      padding: 20px;
      background: #0d1117; 
      color: white;
      display: flex; 
      flex-direction: column; 
      align-items: center;
      min-height: 100vh;
    }
    
    .container {
      background: rgba(22, 27, 34, 0.9);
      padding: 30px; 
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      border: 1px solid #00f0ff;
      width: 100%; 
      max-width: 400px;
      text-align: center;
    }
    
    h2 { 
      color: #00f0ff; 
      margin-top: 0; 
      font-size: 28px;
    }
    
    input[type="file"], input[type="text"] {
      width: 100%; 
      padding: 12px; 
      margin-bottom: 15px;
      border-radius: 8px; 
      border: 1px solid #30363d;
      background: #010409; 
      color: white;
      font-size: 16px;
    }
    
    /* ปรับแต่งปุ่มอัปโหลด */
    button {
      width: 100%; 
      padding: 14px;
      background: #00f0ff; 
      color: #000;
      border: none; 
      border-radius: 8px;
      font-size: 20px; 
      font-weight: bold;
      cursor: pointer; 
      transition: 0.3s;
    }
    
    button:hover { 
      background: #00c3cc; 
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); 
    }
    
    #preview {
      max-width: 100%; 
      height: auto; 
      max-height: 250px;
      border-radius: 8px; 
      margin-bottom: 15px; 
      display: none;
      object-fit: contain;
    }
    
    .loading { 
      display: none; 
      margin-top: 15px; 
      color: #00f0ff; 
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📱 ส่งรูปขึ้นจอ</h2>
    <input type="file" id="imageInput" accept="image/*">
    <img id="preview" src="" alt="Preview">
    <input type="text" id="nameInput" placeholder="ชื่อของคุณ (ใส่หรือไม่ใส่ก็ได้)">
    <button id="uploadBtn">ส่งรูปภาพ</button>
    <div class="loading" id="loadingText">กำลังส่งรูปลอยขึ้นจอ... 🚀</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // ตั้งค่า Firebase เดียวกับ overlay
    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    const imageInput = document.getElementById('imageInput');
    const nameInput = document.getElementById('nameInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const preview = document.getElementById('preview');
    const loadingText = document.getElementById('loadingText');

    // พรีวิวรูปภาพก่อนส่ง
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    });

    // ส่งข้อมูล
    uploadBtn.addEventListener('click', async () => {
      const file = imageInput.files[0];
      if (!file) {
        alert('กรุณาเลือกรูปภาพก่อนนะครับ');
        return;
      }

      uploadBtn.style.display = 'none';
      loadingText.style.display = 'block';

      try {
        const fileName = `${Date.now()}_${file.name}`;
        const sRef = storageRef(storage, `uploads/${roomId}/${fileName}`);
        
        // อัปโหลดไฟล์ไปที่ Firebase Storage
        await uploadBytes(sRef, file);
        const downloadURL = await getDownloadURL(sRef);

        // บันทึก URL ลง Realtime Database ให้ overlay.html ดึงไปใช้
        await push(dbRef(db, `events/${roomId}/donations`), {
          imageUrl: downloadURL,
          name: nameInput.value.trim(),
          timestamp: Date.now()
        });

        alert('ส่งรูปสำเร็จแล้ว! รอดูบนหน้าจอได้เลยครับ 🎉');
        
        // รีเซ็ตฟอร์ม
        imageInput.value = '';
        nameInput.value = '';
        preview.style.display = 'none';
      } catch (error) {
        console.error('Error:', error);
        alert('เกิดข้อผิดพลาดในการส่งรูป กรุณาลองใหม่อีกครั้ง');
      } finally {
        uploadBtn.style.display = 'block';
        loadingText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
