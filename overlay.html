<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Bubble Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #bubble-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .bubble {
      position: absolute;
      bottom: -300px;
      border-radius: 50%;
      border: 4px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5);
      overflow: hidden;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatUp 9s linear forwards;
    }

    .bubble img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.7) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.1) rotate(15deg); opacity: 0; }
    }

    .qr-box {
      position: fixed; bottom: 25px; right: 25px; background: rgba(22, 27, 34, 0.85);
      border: 2px solid #00f0ff; border-radius: 16px; padding: 12px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); backdrop-filter: blur(5px); z-index: 10;
    }
    .qr-box img { width: 130px; height: 130px; border-radius: 8px; background: white; padding: 5px; }
    .qr-box span { color: #00f0ff; font-size: 13px; font-weight: 600; margin-top: 8px; text-shadow: 0 0 5px rgba(0, 0, 0, 0.8); }
  </style>
</head>
<body>

  <div id="bubble-container"></div>
  <div class="qr-box" id="qr-box">
    <img id="qr-image" src="" alt="Scan QR Code">
    <span id="qr-text">📱 สแกนส่งรูปขึ้นจอ</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    
    document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(`https://suchartstudio.github.io/picpost/donate.html?room=${roomId}`)}`;

    const container = document.getElementById('bubble-container');
    const imageList = [];
    
    let currentIndex = 0;
    let loopTimer = null;
    let spawnSpeed = 2500;
    let bubbleScale = 1;
    let spreadArea = 80;
    let lastLeftPos = -100; // ไว้เก็บตำแหน่งล่าสุด ป้องกันฟองสบู่บังกัน

    const settingsRef = ref(db, `events/${roomId}/settings`);
    onValue(settingsRef, (snapshot) => {
      if (!snapshot.exists()) return;
      const settings = snapshot.val();

      document.getElementById('qr-box').style.display = settings.showQR === false ? 'none' : 'flex';
      if (settings.welcomeText) document.getElementById('qr-text').innerText = settings.welcomeText;
      if (settings.bubbleSize) bubbleScale = settings.bubbleSize / 100;
      if (settings.bubbleSpread) spreadArea = settings.bubbleSpread;
      
      if (settings.spawnSpeed && settings.spawnSpeed !== spawnSpeed) {
        spawnSpeed = Number(settings.spawnSpeed);
        resetLoopTimer();
      }
    });

    function createBubble(imgUrl) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      // คำนวณขนาดภาพตามที่รับค่ามาจาก Control
      const baseSize = Math.floor(Math.random() * 80) + 120;
      const finalSize = baseSize * bubbleScale;
      bubble.style.width = `${finalSize}px`;
      bubble.style.height = `${finalSize}px`;

      // อัลกอริทึมสุ่มตำแหน่ง เพื่อลดการซ้อนทับ
      let leftPos;
      let attempts = 0;
      const margin = (100 - spreadArea) / 2; 

      do {
        leftPos = margin + Math.floor(Math.random() * spreadArea);
        attempts++;
      } while (Math.abs(leftPos - lastLeftPos) < 15 && attempts < 15); // ถ้าสุ่มได้จุดใกล้ของเดิม (ห่างไม่ถึง 15%) ให้สุ่มใหม่
      
      lastLeftPos = leftPos;
      bubble.style.left = `${leftPos}%`;

      const duration = Math.floor(Math.random() * 4) + 7;
      bubble.style.animationDuration = `${duration}s`;

      const img = document.createElement('img');
      img.src = imgUrl;
      bubble.appendChild(img);
      container.appendChild(bubble);

      setTimeout(() => bubble.remove(), duration * 1000);
    }

    onChildAdded(ref(db, `events/${roomId}/donations`), (snapshot) => {
      const imgUrl = snapshot.val()?.imageUrl || snapshot.val()?.url;
      if (imgUrl && !imageList.includes(imgUrl)) {
        imageList.push(imgUrl);
        createBubble(imgUrl);
      }
    });

    function resetLoopTimer() {
      if (loopTimer) clearInterval(loopTimer);
      loopTimer = setInterval(() => {
        if (imageList.length > 0) {
          createBubble(imageList[currentIndex]);
          currentIndex = (currentIndex + 1) % imageList.length;
        }
      }, spawnSpeed);
    }
    resetLoopTimer();
  </script>

</body>
</html>
