<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Bubble Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #bubble-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* กล่องห่อหุ้มฟองสบู่และชื่อ เพื่อให้ลอยขึ้นไปพร้อมกัน */
    .bubble-wrapper {
      position: absolute;
      bottom: -350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: floatUp 9s linear forwards;
    }

    /* ฟองสบู่วงกลม */
    .bubble {
      border-radius: 50%;
      border: 4px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5);
      overflow: hidden;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bubble img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    /* ป้ายชื่อด้านล่าง */
    .bubble-name {
      color: #ffffff;
      font-weight: 400;
      font-size: 16px;
      background: rgba(22, 27, 34, 0.85);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.5);
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      white-space: nowrap;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.7) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.1) rotate(15deg); opacity: 0; }
    }

    /* Animation พิเศษ สำหรับรูปภาพที่ส่งเข้ามาใหม่ (Popup กลางจอ) */
    .new-image-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    @keyframes popIn {
      to { transform: translate(-50%, -50%) scale(1); }
    }

    .new-image-popup.fly-away {
      animation: flyAway 2s ease-in forwards;
    }

    @keyframes flyAway {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -150vh) scale(0.5); opacity: 0; }
    }

    /* รูปแบบพื้นฐานของ QR Box */
    .qr-box {
      position: fixed; 
      background: rgba(22, 27, 34, 0.85);
      border: 2px solid #00f0ff; 
      border-radius: 16px; 
      padding: 12px;
      display: flex; 
      flex-direction: column; 
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); 
      backdrop-filter: blur(5px); 
      z-index: 10;
      transition: all 0.3s ease-in-out;
    }
    
    .qr-box img { 
      width: 220px; /* ขนาดเริ่มต้น */
      height: 220px; 
      border-radius: 8px; 
      background: white; 
      padding: 5px; 
      transition: width 0.3s, height 0.3s;
    }
    
    .qr-box span { 
      color: #00f0ff; 
      font-size: 13px; 
      font-weight: 600; 
      margin-top: 8px; 
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.8); 
    }

    /* Class จัดตำแหน่ง QR Box ที่ดึงมาจาก Control */
    .center { top: 50%; left: 50%; transform: translate(-50%, -50%); bottom: auto; right: auto; }
    .top-center { top: 25px; left: 50%; transform: translateX(-50%); bottom: auto; right: auto; }
    .bottom-center { bottom: 25px; left: 50%; transform: translateX(-50%); top: auto; right: auto; }
    .top-left { top: 25px; left: 25px; bottom: auto; right: auto; transform: none; }
    .top-right { top: 25px; right: 25px; bottom: auto; left: auto; transform: none; }
    .bottom-left { bottom: 25px; left: 25px; top: auto; right: auto; transform: none; }
    .bottom-right { bottom: 25px; right: 25px; top: auto; left: auto; transform: none; }
  </style>
</head>
<body>

  <div id="bubble-container"></div>
  <div class="qr-box bottom-right" id="qr-box">
    <img id="qr-image" src="" alt="Scan QR Code">
    <span id="qr-text">📱 สแกนส่งรูปขึ้นจอ</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    
    document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(`https://suchartstudio.github.io/picpost/donate.html?room=${roomId}`)}`;

    const container = document.getElementById('bubble-container');
    const qrBox = document.getElementById('qr-box');
    const qrImage = document.getElementById('qr-image');
    const imageList = []; 
    
    let currentIndex = 0;
    let loopTimer = null;
    let spawnSpeed = 2500;
    let bubbleScale = 1;
    let spreadArea = 80;
    let bubbleMode = 'full';
    let lastLeftPos = -100; 
    const pageLoadTime = Date.now();

    const settingsRef = ref(db, `events/${roomId}/settings`);
    onValue(settingsRef, (snapshot) => {
      if (!snapshot.exists()) return;
      const settings = snapshot.val();

      // เปิด-ปิด QR
      qrBox.style.display = settings.showQR === false ? 'none' : 'flex';
      
      // ข้อความ
      if (settings.welcomeText) document.getElementById('qr-text').innerText = settings.welcomeText;
      
      // ตำแหน่ง QR
      if (settings.qrPosition) {
        qrBox.className = `qr-box ${settings.qrPosition}`;
      } else {
        qrBox.className = 'qr-box bottom-right';
      }

      // ขนาด QR
      if (settings.qrSize) {
        qrImage.style.width = `${settings.qrSize}px`;
        qrImage.style.height = `${settings.qrSize}px`;
      }

      // ตั้งค่า Bubble
      if (settings.avatarScale) bubbleScale = settings.avatarScale;
      if (settings.avatarSpread) spreadArea = settings.avatarSpread;
      if (settings.bubbleMode) bubbleMode = settings.bubbleMode;
      
      if (settings.avatarSpeed) {
        let newSpeed = 2500 / settings.avatarSpeed;
        if (newSpeed !== spawnSpeed) {
          spawnSpeed = newSpeed;
          resetLoopTimer();
        }
      }
    });

    function createBubble(itemData) {
      const wrapper = document.createElement('div');
      wrapper.className = 'bubble-wrapper';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      const baseSize = Math.floor(Math.random() * 80) + 120;
      const finalSize = baseSize * bubbleScale;
      bubble.style.width = `${finalSize}px`;
      bubble.style.height = `${finalSize}px`;

      const img = document.createElement('img');
      img.src = itemData.imgUrl;
      bubble.appendChild(img);
      wrapper.appendChild(bubble);

      if (itemData.name) {
        const nameTag = document.createElement('div');
        nameTag.className = 'bubble-name';
        nameTag.innerText = itemData.name;
        nameTag.style.fontSize = `${Math.max(12, 16 * bubbleScale)}px`;
        wrapper.appendChild(nameTag);
      }

      let leftPos;
      let attempts = 0;
      
      if (bubbleMode === 'sides') {
        do {
          const isLeft = Math.random() > 0.5;
          leftPos = isLeft ? 2 + Math.random() * 20 : 75 + Math.random() * 20;
          attempts++;
        } while (Math.abs(leftPos - lastLeftPos) < 15 && attempts < 15);
      } else {
        const margin = (100 - spreadArea) / 2; 
        do {
          leftPos = margin + Math.floor(Math.random() * spreadArea);
          attempts++;
        } while (Math.abs(leftPos - lastLeftPos) < 15 && attempts < 15);
      }
      
      lastLeftPos = leftPos;
      wrapper.style.left = `${leftPos}%`;

      const duration = Math.floor(Math.random() * 4) + 7;
      wrapper.style.animationDuration = `${duration}s`;

      container.appendChild(wrapper);
      setTimeout(() => wrapper.remove(), duration * 1000);
    }

    function showNewImageCenter(itemData) {
      const popup = document.createElement('div');
      popup.className = 'new-image-popup';
      
      const size = 300 * bubbleScale;
      popup.innerHTML = `
        <div class="bubble" style="width: ${size}px; height: ${size}px; border-width: 8px;">
          <img src="${itemData.imgUrl}">
        </div>
        ${itemData.name ? `<div class="bubble-name" style="font-size: ${20 * bubbleScale}px; margin-top: 15px;">${itemData.name}</div>` : ''}
      `;
      
      document.body.appendChild(popup);
      
      setTimeout(() => {
        popup.classList.add('fly-away');
        setTimeout(() => {
          popup.remove();
          imageList.push(itemData); 
          createBubble(itemData);
        }, 2000); 
      }, 3000);
    }

    onChildAdded(ref(db, `events/${roomId}/donations`), (snapshot) => {
      const data = snapshot.val();
      const imgUrl = data?.imageUrl || data?.url;
      const name = data?.name || data?.senderName || data?.displayName || '';
      const timestamp = data?.timestamp || 0;

      if (imgUrl && !imageList.some(item => item.imgUrl === imgUrl)) {
        const newItem = { imgUrl, name };
        
        if (timestamp > pageLoadTime - 3000) {
          showNewImageCenter(newItem);
        } else {
          imageList.push(newItem);
          createBubble(newItem);
        }
      }
    });

    function resetLoopTimer() {
      if (loopTimer) clearInterval(loopTimer);
      loopTimer = setInterval(() => {
        if (imageList.length > 0) {
          createBubble(imageList[currentIndex]);
          currentIndex = (currentIndex + 1) % imageList.length;
        }
      }, spawnSpeed);
    }
    resetLoopTimer();
  </script>

</body>
</html>
