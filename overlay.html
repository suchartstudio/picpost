<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>OBS Bubble Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #bubble-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .highlight-center {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0);
        animation: popIn 0.6s forwards; z-index: 1000;
    }
    
    @keyframes popIn {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
    }

    .bubble-wrapper { position: absolute; bottom: -200px; animation: floatUp linear forwards; z-index: 1; }
    .bubble-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: sway 3.5s ease-in-out infinite; }

    .bubble { border-radius: 50%; border: 5px solid #00f0ff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .bubble img { width: 100%; height: 100%; object-fit: cover; }
    .bubble-name { color: #fff; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); background: rgba(0,0,0,0.5); padding: 4px 15px; border-radius: 20px; }

    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-120vh); opacity: 0; } }
    @keyframes floatFromCenter { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-70vh); opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: translateX(-20px); } 50% { transform: translateX(20px); } }
  </style>
</head>
<body>
  <div id="bubble-container"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onChildRemoved, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk", databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "suchartstudio-9a78d" };
    const db = getDatabase(initializeApp(firebaseConfig));
    const roomId = new URLSearchParams(window.location.search).get('room') || 'default';
    const container = document.getElementById('bubble-container');
    
    let imageList = [], currentIndex = 0, loopTimer = null, spawnSpeed = 2500, displayMode = 'full';

    onValue(ref(db, `events/${roomId}/settings`), (snapshot) => {
      if (snapshot.exists()) displayMode = snapshot.val().displayMode || 'full';
    });

    function getPositionX() {
        if (displayMode === 'split') {
            const isLeft = Math.random() > 0.5;
            return isLeft ? Math.floor(Math.random() * 20) + 5 : Math.floor(Math.random() * 20) + 75; 
        }
        return Math.floor(Math.random() * 80) + 10;
    }

    function createBubble(itemData, isNew = false) {
      const wrapper = document.createElement('div');
      wrapper.setAttribute('data-key', itemData.key);
      wrapper.innerHTML = `<div class="bubble-inner"><div class="bubble" style="width:150px;height:150px;"><img src="${itemData.imgUrl}"></div>${itemData.name ? `<div class="bubble-name">${itemData.name}</div>` : ''}</div>`;
      container.appendChild(wrapper);

      const duration = Math.floor(Math.random() * 4) + 8;
      const posX = getPositionX();

      if(isNew) {
          wrapper.className = 'highlight-center';
          setTimeout(() => {
              if(!document.body.contains(wrapper)) return;
              wrapper.className = 'bubble-wrapper';
              wrapper.style.left = `${posX}%`;
              wrapper.style.bottom = '50%'; 
              wrapper.style.animationName = 'floatFromCenter';
              wrapper.style.animationDuration = `${duration}s`;
              setTimeout(() => wrapper.remove(), duration * 1000);
          }, 3000);
      } else {
          wrapper.className = 'bubble-wrapper';
          wrapper.style.left = `${posX}%`;
          wrapper.style.animationDuration = `${duration}s`;
          setTimeout(() => wrapper.remove(), duration * 1000);
      }
    }

    onChildAdded(ref(db, `events/${roomId}/donations`), (snapshot) => {
      const data = snapshot.val();
      const imgUrl = data?.imageUrl || data?.url;
      if (imgUrl && !imageList.some(item => item.key === snapshot.key)) {
        const newItem = { key: snapshot.key, imgUrl, name: data?.name || '' };
        imageList.push(newItem);
        createBubble(newItem, true); 
      }
    });

    onChildRemoved(ref(db, `events/${roomId}/donations`), (snapshot) => {
        imageList = imageList.filter(item => item.key !== snapshot.key);
        document.querySelectorAll(`[data-key="${snapshot.key}"]`).forEach(el => el.remove());
    });

    setInterval(() => {
        if (imageList.length > 0) {
          createBubble(imageList[currentIndex], false);
          currentIndex = (currentIndex + 1) % imageList.length;
        }
    }, spawnSpeed);
  </script>
</body>
</html>
