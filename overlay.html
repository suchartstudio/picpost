<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Bubble Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    
    /* ตั้งค่าพื้นหลังโปร่งใสสำหรับ OBS Browser Source */
    body { 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background: transparent; 
    }

    #bubble-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* สไตล์ฟองสบู่วงกลม */
    .bubble {
      position: absolute;
      bottom: -180px;
      border-radius: 50%;
      border: 4px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5);
      overflow: hidden;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatUp 8s linear forwards;
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* แอนิเมชันฟองสบู่ลอยขึ้นด้านบน */
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-115vh) scale(1.1) rotate(15deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="bubble-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMptdLpLEdbeVFKZj82M0gyoV2m_2y5Pk",
      authDomain: "suchartstudio-9a78d.firebaseapp.com",
      databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "suchartstudio-9a78d",
      storageBucket: "suchartstudio-9a78d.firebasestorage.app",
      messagingSenderId: "953369646185",
      appId: "1:953369646185:web:018e66f489aad5356ebef8",
      measurementId: "G-J7M38HNDYD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ดึงรหัสห้องจาก Query String (?room=xxx)
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    const container = document.getElementById('bubble-container');

    // ฟังก์ชันสร้างฟองสบู่วงกลม
    function createBubble(imgUrl) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      // สุ่มขนาดฟองสบู่ระหว่าง 120px - 200px
      const size = Math.floor(Math.random() * 80) + 120;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;

      // สุ่มตำแหน่งตามแนวตั้ง (แกน X)
      const leftPos = Math.floor(Math.random() * 80) + 5;
      bubble.style.left = `${leftPos}%`;

      // สุ่มระยะเวลาการลอย (7 - 12 วินาที)
      const duration = Math.floor(Math.random() * 5) + 7;
      bubble.style.animationDuration = `${duration}s`;

      const img = document.createElement('img');
      img.src = imgUrl;
      bubble.appendChild(img);

      container.appendChild(bubble);

      // ทำความสะอาด Element เมื่อลอยพ้นหน้าจอแล้ว
      setTimeout(() => {
        bubble.remove();
      }, duration * 1000);
    }

    // ดักฟังรูปภาพใหม่ที่ถูกเพิ่มเข้ามาใน Firebase
    const donationsRef = ref(db, `events/${roomId}/donations`);
    onChildAdded(donationsRef, (snapshot) => {
      const data = snapshot.val();
      if (data && (data.imageUrl || data.url)) {
        createBubble(data.imageUrl || data.url);
      }
    });
  </script>

</body>
</html>
